name: VEN-007C Browser Acceptance Temporary

on:
  push:
    branches:
      - refactor/ven-007c-diagnostics-ui

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "VENDIFY_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Run PWA browser acceptance
        run: npm run qa:pwa:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ven-007c-browser-evidence
          path: |
            qa-output/pwa-matrix/browser-acceptance.json
            qa-output/pwa-matrix/cold-boot-offline-390x844.png
          if-no-files-found: warn