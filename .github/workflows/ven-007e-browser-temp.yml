name: VEN-007E Browser Evidence

on:
  push:
    branches:
      - refactor/ven-007e-product-media-retirement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Locate Chrome
        shell: pwsh
        run: |
          $Candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )

          $ChromePath = $Candidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $ChromePath) {
            $ChromeCommand = Get-Command chrome.exe -ErrorAction SilentlyContinue
            if ($ChromeCommand) {
              $ChromePath = $ChromeCommand.Source
            }
          }

          if (-not $ChromePath) {
            throw "Google Chrome executable not found"
          }

          "VENDIFY_CHROME_PATH=$ChromePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Chrome executable: $ChromePath"
          & $ChromePath --version

      - name: Run VEN-007E real browser acceptance
        run: npm run qa:pwa:browser

      - name: Upload VEN-007E browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: ven-007e-browser-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            qa-output/pwa-matrix/browser-acceptance.json
            qa-output/pwa-matrix/cold-boot-offline-390x844.png
