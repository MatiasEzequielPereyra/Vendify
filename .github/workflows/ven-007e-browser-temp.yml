name: VEN-007E Browser Evidence

on:
  push:
    branches:
      - refactor/ven-007e-product-media-retirement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(
            command -v google-chrome-stable ||
            command -v google-chrome ||
            command -v chromium-browser ||
            command -v chromium ||
            true
          )"

          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium executable not found" >&2
            exit 1
          fi

          echo "VENDIFY_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Chrome executable: $CHROME_PATH"
          "$CHROME_PATH" --version

      - name: Run VEN-007E real browser acceptance
        run: npm run qa:pwa:browser

      - name: Upload VEN-007E browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: ven-007e-browser-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            qa-output/pwa-matrix/browser-acceptance.json
            qa-output/pwa-matrix/cold-boot-offline-390x844.png
