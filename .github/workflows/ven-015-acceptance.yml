name: VEN-015 Temporary Acceptance

on:
  push:
    branches:
      - fix/ven-015-manager-team-audit

permissions:
  contents: read

jobs:
  manager-live:
    if: contains(github.event.head_commit.message, '[ven015-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VEN015_SUPABASE_URL: https://clqxfwiutwnhbejezakw.supabase.co
      VEN015_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iRTaDuzTMOjrGQDc7VaB1w_c5GzxfI8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install temporary Supabase client
        run: npm install --no-save --ignore-scripts @supabase/supabase-js

      - name: Create disposable anonymous Auth session
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import { createClient } from "@supabase/supabase-js";

          const url = process.env.VEN015_SUPABASE_URL;
          const key = process.env.VEN015_SUPABASE_PUBLISHABLE_KEY;
          const client = createClient(url, key, {
            auth: { persistSession: false, autoRefreshToken: false }
          });
          const { data, error } = await client.auth.signInAnonymously();
          if (error || !data?.user?.id || !data?.session?.access_token) {
            throw new Error("anonymous Auth fixture unavailable: " + (error?.code ?? error?.message ?? "unknown"));
          }

          const id = data.user.id;
          const tag = id.replaceAll("-", "").slice(0, 16);
          const token = data.session.access_token;
          const managerUsername = `ven015_mgr_${tag.slice(0, 10)}`;
          const cashierUsername = `ven015_cash_${tag.slice(0, 10)}`;
          const cashierPassword = `V15!${crypto.randomBytes(24).toString("base64url")}`;
          const resetPassword = `V15!${crypto.randomBytes(24).toString("base64url")}`;

          for (const value of [token, cashierPassword, resetPassword]) {
            console.log(`::add-mask::${value}`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, [
            `VEN015_MANAGER_USER_ID=${id}`,
            `VEN015_MANAGER_USERNAME=${managerUsername}`,
            `VEN015_ACCESS_TOKEN=${token}`,
            `VEN015_CASHIER_USERNAME=${cashierUsername}`,
            `VEN015_CASHIER_PASSWORD=${cashierPassword}`,
            `VEN015_RESET_PASSWORD=${resetPassword}`
          ].join("\n") + "\n");

          fs.writeFileSync("ven015-fixture.json", JSON.stringify({
            user_id: id,
            username: managerUsername,
            auth_kind: "anonymous"
          }));
          NODE

      - name: Upload disposable fixture metadata
        uses: actions/upload-artifact@v4
        with:
          name: ven015-fixture-metadata
          path: ven015-fixture.json
          retention-days: 1
          if-no-files-found: error

      - name: Adapt live acceptance harness to existing JWT
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ven-015-live-manager-acceptance.mjs")
          source = path.read_text()

          start = source.index("const tag = crypto.randomUUID()")
          end = source.index("\n\nasync function jsonFetch", start)
          declarations = """const managerUserId = process.env.VEN015_MANAGER_USER_ID;
          const managerUsername = process.env.VEN015_MANAGER_USERNAME;
          const cashierUsername = process.env.VEN015_CASHIER_USERNAME;
          const cashierPassword = process.env.VEN015_CASHIER_PASSWORD;
          const resetPassword = process.env.VEN015_RESET_PASSWORD;"""
          source = source[:start] + declarations + source[end:]

          start = source.index("const signup = await jsonFetch(")
          end = source.index('if (!accessToken) throw new Error("manager authenticated login did not become available");', start)
          end += len('if (!accessToken) throw new Error("manager authenticated login did not become available");')
          auth = """const accessToken = process.env.VEN015_ACCESS_TOKEN;
          if (!accessToken) throw new Error("manager authenticated session missing");"""
          source = source[:start] + auth + source[end:]

          path.write_text(source)
          PY

      - name: Wait for manager membership
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            apikey: process.env.VEN015_SUPABASE_PUBLISHABLE_KEY,
            Authorization: `Bearer ${process.env.VEN015_ACCESS_TOKEN}`,
            "Content-Type": "application/json"
          };
          const url = `${process.env.VEN015_SUPABASE_URL}/rest/v1/rpc/obtener_contexto_app`;
          for (let attempt = 0; attempt < 72; attempt += 1) {
            const response = await fetch(url, { method: "POST", headers, body: "{}" });
            if (response.ok) {
              const body = await response.json();
              if (body?.membership?.role === "manager" && body?.permissions?.manageEmployees === true) {
                process.exit(0);
              }
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error("manager membership was not prepared within acceptance window");
          NODE

      - name: Run authenticated manager acceptance
        run: node scripts/ven-015-live-manager-acceptance.mjs

  browser:
    if: contains(github.event.head_commit.message, '[ven015-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium unavailable on runner"
            exit 2
          fi
          echo "VENDIFY_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Run PWA browser acceptance
        run: npm run qa:pwa:browser
