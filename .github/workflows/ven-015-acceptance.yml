name: VEN-015 Temporary Acceptance

on:
  push:
    branches:
      - fix/ven-015-manager-team-audit

permissions:
  contents: read

jobs:
  manager-live:
    if: contains(github.event.head_commit.message, '[ven015-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VEN015_SUPABASE_URL: https://clqxfwiutwnhbejezakw.supabase.co
      VEN015_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iRTaDuzTMOjrGQDc7VaB1w_c5GzxfI8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary bcrypt helper
        run: npm install --no-save --ignore-scripts bcryptjs
      - name: Prepare direct disposable Auth fixture handshake
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/ven-015-live-manager-acceptance.mjs")
          source = path.read_text()
          source = source.replace(
              'import process from "node:process";',
              'import process from "node:process";\nimport bcrypt from "bcryptjs";'
          )
          first = source.index("const tag = crypto.randomUUID()")
          marker = 'process.stdout.write("VEN015_FIXTURE_WAITING_FOR_MEMBERSHIP=1\\n");'
          last = source.index(marker, first) + len(marker)
          replacement = r'''const managerUserId = crypto.randomUUID();
const tag = managerUserId.replaceAll("-", "").slice(0, 16);
const email = `ven015.manager.${tag}@gmail.com`;
const password = `V15!${crypto.randomBytes(24).toString("base64url")}`;
const managerUsername = `ven015_mgr_${tag.slice(0, 10)}`;
const cashierUsername = `ven015_cash_${tag.slice(0, 10)}`;
const cashierPassword = `V15!${crypto.randomBytes(24).toString("base64url")}`;
const resetPassword = `V15!${crypto.randomBytes(24).toString("base64url")}`;
const passwordHash = await bcrypt.hash(password, 10);

process.stdout.write(`VEN015_FIXTURE_USER_ID=${managerUserId}\\n`);
process.stdout.write(`VEN015_FIXTURE_EMAIL=${email}\\n`);
process.stdout.write(`VEN015_FIXTURE_USERNAME=${managerUsername}\\n`);
process.stdout.write(`VEN015_FIXTURE_PASSWORD_HASH=${passwordHash}\\n`);
process.stdout.write("VEN015_FIXTURE_WAITING_FOR_MEMBERSHIP=1\\n");'''
          path.write_text(source[:first] + replacement + source[last:])
          PY
      - name: Run authenticated manager acceptance
        run: node scripts/ven-015-live-manager-acceptance.mjs

  browser:
    if: contains(github.event.head_commit.message, '[ven015-acceptance]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium unavailable on runner"
            exit 2
          fi
          echo "VENDIFY_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Run PWA browser acceptance
        run: npm run qa:pwa:browser
