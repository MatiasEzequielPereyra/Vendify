name: VEN-002 Orchestrator Re-review

on:
  push:
    branches:
      - fix/ven-002-staging-isolation

permissions:
  contents: read

jobs:
  rereview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: QA
        run: npm run qa

      - name: Staging QA
        run: npm run qa:staging:v2312

      - name: Modular refactor QA
        run: npm run qa:refactor:modular

      - name: Full CI
        run: npm run ci
