name: Vendify CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "security/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - develop
      - refactor/modular-runtime

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quality gate
        run: npm run ci

      - name: Map legacy architecture
        run: npm run analyze:legacy

      - name: Run VEN-007J PWA browser acceptance
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner" >&2
            exit 1
          fi
          echo "Using Chrome: $CHROME"
          VENDIFY_CHROME_PATH="$CHROME" CI=true npm run qa:pwa:browser
